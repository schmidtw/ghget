name: lint

on:
  pull_request:
    paths:
      - docs/install.sh.tmpl
      - .github/workflows/lint.yml
  push:
    branches: [main]
    paths:
      - docs/install.sh.tmpl
      - .github/workflows/lint.yml

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: render template for linting
        run: sed 's/@@VERSION@@/v0.0.0-lint/g' docs/install.sh.tmpl > /tmp/install.sh
      - name: shellcheck
        run: shellcheck --shell=sh /tmp/install.sh
